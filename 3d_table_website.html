<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Table</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
        }
        
        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            z-index: 100;
            background: rgba(0,0,0,0.5);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            z-index: 100;
            background: rgba(0,0,0,0.5);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        
        button {
            margin: 5px;
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            background: #4CAF50;
            color: white;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="info">
            <h3>3D Interactive Table</h3>
            <p>🖱️ Click and drag to rotate</p>
            <p>🔍 Scroll to zoom</p>
            <p>👆 Click items to navigate</p>
        </div>
        
        <div id="controls">
            <button onclick="resetView()">Reset View</button>
            <button onclick="toggleWireframe()">Toggle Wireframe</button>
            <button onclick="changeTableStyle()">Change Style</button>
        </div>
    </div>

    <script>
        let scene, camera, renderer, table, isWireframe = false;
        let mouseX = 0, mouseY = 0;
        let targetRotationX = 0, targetRotationY = 0;
        let currentRotationX = 0, currentRotationY = 0;
        let isMouseDown = false;
        let tableStyle = 0;
        let tableItems = [];
        let raycaster, mouse;
        
        const tableStyles = [
            { color: 0xD2691E, name: "Light Wood" },
            { color: 0x8B4513, name: "Medium Wood" },
            { color: 0xA0522D, name: "Dark Wood" },
            { color: 0xCD853F, name: "Golden Wood" }
        ];

        function init() {
            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x222222);
            
            // Camera setup
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(3, 4, 4);
            camera.lookAt(0, 0, 0);
            
            // Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('container').appendChild(renderer.domElement);
            
            // Raycaster for mouse interactions
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
            directionalLight.position.set(10, 10, 5);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            scene.add(directionalLight);
            
            // Create table
            createTable();
            
            // Add items to table
            addTableItems();
            
            // Event listeners
            setupEventListeners();
            
            // Start animation
            animate();
        }

        function createTable() {
            if (table) {
                scene.remove(table);
            }
            
            table = new THREE.Group();
            
            // Create wood plank effect for table top
            const plankWidth = 0.8;
            const numPlanks = 5;
            const plankColors = [0xDEB887, 0xCD853F, 0xDEB887, 0xCD853F, 0xDEB887]; // Alternating light wood and golden wood
            
            for (let i = 0; i < numPlanks; i++) {
                const plankGeometry = new THREE.BoxGeometry(plankWidth, 0.2, 2.5);
                const plankMaterial = new THREE.MeshLambertMaterial({ 
                    color: plankColors[i % plankColors.length]
                });
                const plank = new THREE.Mesh(plankGeometry, plankMaterial);
                plank.position.set(-1.6 + (i * plankWidth), 1.5, 0);
                plank.castShadow = true;
                plank.receiveShadow = true;
                table.add(plank);
            }
            
            // Table legs - using golden wood tone
            const legGeometry = new THREE.BoxGeometry(0.15, 1.5, 0.15);
            const legMaterial = new THREE.MeshLambertMaterial({ 
                color: 0xCD853F 
            });
            
            const legPositions = [
                [-1.7, 0.75, -1], [1.7, 0.75, -1],
                [-1.7, 0.75, 1], [1.7, 0.75, 1]
            ];
            
            legPositions.forEach(pos => {
                const leg = new THREE.Mesh(legGeometry, legMaterial);
                leg.position.set(...pos);
                leg.castShadow = true;
                table.add(leg);
            });
            
            // Remove the decorative element to match the simple style
            scene.add(table);
            
            // Re-add items when changing style
            addTableItems();
        }

        function addTableItems() {
            // Clear existing items
            tableItems.forEach(item => {
                if (item.parent) {
                    item.parent.remove(item);
                }
            });
            tableItems = [];

            // 1. Polaroid Photo
            const polaroidGroup = new THREE.Group();
            const photoBase = new THREE.BoxGeometry(0.3, 0.02, 0.35);
            const photoBaseMaterial = new THREE.MeshLambertMaterial({ color: 0xFFFFF0 });
            const photoBaseMesh = new THREE.Mesh(photoBase, photoBaseMaterial);
            
            // Create a gradient/landscape photo effect
            const photoImage = new THREE.BoxGeometry(0.25, 0.021, 0.25);
            
// 2. Mirrorless Camera (Sony Alpha style)
            const cameraGroup = new THREE.Group();
            
            // Main camera body - flat rectangular design
            const cameraBody = new THREE.BoxGeometry(0.35, 0.2, 0.15);
            const cameraBodyMaterial = new THREE.MeshLambertMaterial({ color: 0x2a2a2a });
            const cameraBodyMesh = new THREE.Mesh(cameraBody, cameraBodyMaterial);
            
            // Large prominent lens
            const cameraLens = new THREE.CylinderGeometry(0.12, 0.12, 0.18, 20);
            const cameraLensMaterial = new THREE.MeshLambertMaterial({ color: 0x1a1a1a });
            const cameraLensMesh = new THREE.Mesh(cameraLens, cameraLensMaterial);
            cameraLensMesh.rotation.x = Math.PI / 2;
            cameraLensMesh.position.z = 0.16;
            
            // Lens front glass
            const lensGlass = new THREE.CylinderGeometry(0.1, 0.1, 0.02, 20);
            const lensGlassMaterial = new THREE.MeshLambertMaterial({ 
                color: 0x333333,
                transparent: true,
                opacity: 0.8 
            });
            const lensGlassMesh = new THREE.Mesh(lensGlass, lensGlassMaterial);
            lensGlassMesh.rotation.x = Math.PI / 2;
            lensGlassMesh.position.z = 0.26;
            
            // Small viewfinder bump
            const viewfinder = new THREE.BoxGeometry(0.08, 0.04, 0.06);
            const viewfinderMaterial = new THREE.MeshLambertMaterial({ color: 0x1a1a1a });
            const viewfinderMesh = new THREE.Mesh(viewfinder, viewfinderMaterial);
            viewfinderMesh.position.y = 0.12;
            viewfinderMesh.position.z = -0.045;
            
            // Small control dial
            const controlDial = new THREE.CylinderGeometry(0.02, 0.02, 0.01, 12);
            const controlDialMaterial = new THREE.MeshLambertMaterial({ color: 0x404040 });
            const controlDialMesh = new THREE.Mesh(controlDial, controlDialMaterial);
            controlDialMesh.position.set(0.12, 0.08, 0.08);
            controlDialMesh.rotation.z = Math.PI / 2;
            
            cameraGroup.add(cameraBodyMesh);
            cameraGroup.add(cameraLensMesh);
            cameraGroup.add(lensGlassMesh);
            cameraGroup.add(viewfinderMesh);
            cameraGroup.add(controlDialMesh);
            cameraGroup.position.set(0.8, 1.71, 0.2);
            cameraGroup.userData = { 
                type: 'camera', 
                originalY: 1.71, 
                url: '#photography',
                name: 'Photography'
            };
            cameraGroup.castShadow = true;
            table.add(cameraGroup);
            tableItems.push(cameraGroup);

            // 3. Laptop
            const laptopGroup = new THREE.Group();
            const laptopBase = new THREE.BoxGeometry(0.6, 0.03, 0.4);
            const laptopBaseMaterial = new THREE.MeshLambertMaterial({ color: 0x2c2c2c });
            const laptopBaseMesh = new THREE.Mesh(laptopBase, laptopBaseMaterial);
            
            const laptopScreen = new THREE.BoxGeometry(0.55, 0.35, 0.02);
            const laptopScreenMaterial = new THREE.MeshLambertMaterial({ color: 0x1a1a1a });
            const laptopScreenMesh = new THREE.Mesh(laptopScreen, laptopScreenMaterial);
            laptopScreenMesh.position.y = 0.175;
            laptopScreenMesh.position.z = -0.19;
            laptopScreenMesh.rotation.x = -0.2;
            
            laptopGroup.add(laptopBaseMesh);
            laptopGroup.add(laptopScreenMesh);
            laptopGroup.position.set(-0.2, 1.715, 0.3);
            laptopGroup.userData = { 
                type: 'laptop', 
                originalY: 1.715, 
                url: '#projects',
                name: 'Projects'
            };
            laptopGroup.castShadow = true;
            table.add(laptopGroup);
            tableItems.push(laptopGroup);

            // 4. Designer Crossbody Purse (Tory Burch style)
            const purseGroup = new THREE.Group();
            
            // Main purse body - rectangular crossbody shape
            const purseBody = new THREE.BoxGeometry(0.35, 0.25, 0.08);
            const purseBodyMaterial = new THREE.MeshLambertMaterial({ color: 0xB22222 }); // Rich red leather
            const purseBodyMesh = new THREE.Mesh(purseBody, purseBodyMaterial);
            
            // Purse flap - slightly overlapping front panel
            const purseFlap = new THREE.BoxGeometry(0.36, 0.15, 0.02);
            const purseFlapMaterial = new THREE.MeshLambertMaterial({ color: 0xA01E1E }); // Slightly darker red
            const purseFlapMesh = new THREE.Mesh(purseFlap, purseFlapMaterial);
            purseFlapMesh.position.z = 0.05;
            purseFlapMesh.position.y = 0.05;
            
            // Gold logo - simple geometric T shape
            const logoBar1 = new THREE.BoxGeometry(0.04, 0.008, 0.005);
            const logoBar2 = new THREE.BoxGeometry(0.008, 0.03, 0.005);
            const logoMaterial = new THREE.MeshLambertMaterial({ color: 0xFFD700 }); // Gold
            const logoMesh1 = new THREE.Mesh(logoBar1, logoMaterial);
            const logoMesh2 = new THREE.Mesh(logoBar2, logoMaterial);
            logoMesh1.position.set(0, 0.01, 0.052);
            logoMesh2.position.set(0, -0.005, 0.052);
            
            // Gold chain strap - curved chain design
            const chainLinks = [];
            const numLinks = 12;
            for (let i = 0; i < numLinks; i++) {
                const link = new THREE.TorusGeometry(0.008, 0.003, 6, 12);
                const linkMaterial = new THREE.MeshLambertMaterial({ color: 0xFFD700 });
                const linkMesh = new THREE.Mesh(link, linkMaterial);
                
                // Position links in a curved chain pattern
                const angle = (i / numLinks) * Math.PI;
                linkMesh.position.x = Math.cos(angle) * 0.3;
                linkMesh.position.y = 0.15 + Math.sin(angle) * 0.1;
                linkMesh.position.z = -0.05;
                linkMesh.rotation.y = angle;
                
                purseGroup.add(linkMesh);
                chainLinks.push(linkMesh);
            }
            
            // Small gold hardware details
            const hardware1 = new THREE.CylinderGeometry(0.005, 0.005, 0.01, 8);
            const hardwareMaterial = new THREE.MeshLambertMaterial({ color: 0xFFD700 });
            const hardwareMesh1 = new THREE.Mesh(hardware1, hardwareMaterial);
            const hardwareMesh2 = new THREE.Mesh(hardware1, hardwareMaterial);
            hardwareMesh1.position.set(-0.15, 0.1, 0.045);
            hardwareMesh2.position.set(0.15, 0.1, 0.045);
            hardwareMesh1.rotation.x = Math.PI / 2;
            hardwareMesh2.rotation.x = Math.PI / 2;
            
            purseGroup.add(purseBodyMesh);
            purseGroup.add(purseFlapMesh);
            purseGroup.add(logoMesh1);
            purseGroup.add(logoMesh2);
            purseGroup.add(hardwareMesh1);
            purseGroup.add(hardwareMesh2);
            
            purseGroup.position.set(1.3, 1.725, -0.7);
            purseGroup.rotation.y = -0.3; // Slight angle for better view
            purseGroup.userData = { 
                type: 'purse', 
                originalY: 1.725, 
                url: '#about',
                name: 'About Me'
            };
            purseGroup.castShadow = true;
            table.add(purseGroup);
            tableItems.push(purseGroup);

            // 5. Thai Tea Drink
            const thaiTeaGroup = new THREE.Group();
            const cupGeometry = new THREE.CylinderGeometry(0.08, 0.06, 0.25, 16);
            const cupMaterial = new THREE.MeshLambertMaterial({ color: 0xFFFFFF });
            const cupMesh = new THREE.Mesh(cupGeometry, cupMaterial);
            
            const teaGeometry = new THREE.CylinderGeometry(0.075, 0.055, 0.2, 16);
            const teaMaterial = new THREE.MeshLambertMaterial({ color: 0xD2691E });
            const teaMesh = new THREE.Mesh(teaGeometry, teaMaterial);
            teaMesh.position.y = 0.02;
            
            const creamGeometry = new THREE.CylinderGeometry(0.075, 0.075, 0.05, 16);
            const creamMaterial = new THREE.MeshLambertMaterial({ color: 0xFFF8DC });
            const creamMesh = new THREE.Mesh(creamGeometry, creamMaterial);
            creamMesh.position.y = 0.15;
            
            const straw = new THREE.CylinderGeometry(0.005, 0.005, 0.4, 8);
            const strawMaterial = new THREE.MeshLambertMaterial({ color: 0xFF69B4 });
            const strawMesh = new THREE.Mesh(straw, strawMaterial);
            strawMesh.position.y = 0.2;
            strawMesh.position.x = 0.05;
            
            thaiTeaGroup.add(cupMesh);
            thaiTeaGroup.add(teaMesh);
            thaiTeaGroup.add(creamMesh);
            thaiTeaGroup.add(strawMesh);
            thaiTeaGroup.position.set(-1.5, 1.725, 0.8);
            thaiTeaGroup.userData = { 
                type: 'thaitea', 
                originalY: 1.725, 
                url: '#blog',
                name: 'Blog'
            };
            thaiTeaGroup.castShadow = true;
            table.add(thaiTeaGroup);
            tableItems.push(thaiTeaGroup);
        }

        function setupEventListeners() {
            const canvas = renderer.domElement;
            
            canvas.addEventListener('mousedown', onMouseDown, false);
            canvas.addEventListener('mousemove', onMouseMove, false);
            canvas.addEventListener('mouseup', onMouseUp, false);
            canvas.addEventListener('wheel', onWheel, false);
            canvas.addEventListener('click', onMouseClick, false);
            
            window.addEventListener('resize', onWindowResize, false);
        }

        function onMouseDown(event) {
            isMouseDown = true;
            mouseX = event.clientX;
            mouseY = event.clientY;
        }

        function onMouseMove(event) {
            if (!isMouseDown) {
                // Update mouse position for hover effects
                const rect = renderer.domElement.getBoundingClientRect();
                mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
                
                // Check for hover effects
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(tableItems, true);
                
                // Reset all items
                tableItems.forEach(item => {
                    item.position.y = item.userData.originalY;
                    item.scale.set(1, 1, 1);
                });
                
                // Apply hover effect to intersected item
                if (intersects.length > 0) {
                    let hoveredItem = intersects[0].object;
                    while (hoveredItem.parent && !hoveredItem.userData.type) {
                        hoveredItem = hoveredItem.parent;
                    }
                    if (hoveredItem.userData.type) {
                        hoveredItem.position.y = hoveredItem.userData.originalY + 0.05;
                        hoveredItem.scale.set(1.05, 1.05, 1.05);
                        document.body.style.cursor = 'pointer';
                    }
                } else {
                    document.body.style.cursor = 'default';
                }
                return;
            }
            
            const deltaX = event.clientX - mouseX;
            const deltaY = event.clientY - mouseY;
            
            targetRotationY += deltaX * 0.01;
            targetRotationX += deltaY * 0.01;
            
            mouseX = event.clientX;
            mouseY = event.clientY;
        }

        function onMouseClick(event) {
            if (isMouseDown) return; // Ignore clicks that are part of drag
            
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(tableItems, true);
            
            if (intersects.length > 0) {
                let clickedItem = intersects[0].object;
                while (clickedItem.parent && !clickedItem.userData.type) {
                    clickedItem = clickedItem.parent;
                }
                
                if (clickedItem.userData.type) {
                    // Add click animation
                    clickedItem.scale.set(0.95, 0.95, 0.95);
                    setTimeout(() => {
                        clickedItem.scale.set(1.05, 1.05, 1.05);
                        
                        // Show navigation info (in a real website, you'd navigate here)
                        alert(`Navigating to: ${clickedItem.userData.name}\nURL: ${clickedItem.userData.url}`);
                        
                        // In a real implementation, you would do:
                        // window.location.href = clickedItem.userData.url;
                        // or for single page apps:
                        // router.push(clickedItem.userData.url);
                        
                    }, 150);
                }
            }
        }

        function onMouseUp(event) {
            isMouseDown = false;
        }

        function onWheel(event) {
            const zoom = event.deltaY * 0.01;
            camera.position.multiplyScalar(1 + zoom * 0.1);
            camera.position.clampLength(3, 20);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            
            // Smooth rotation interpolation
            currentRotationX += (targetRotationX - currentRotationX) * 0.05;
            currentRotationY += (targetRotationY - currentRotationY) * 0.05;
            
            if (table) {
                table.rotation.x = currentRotationX;
                table.rotation.y = currentRotationY;
            }
            
            renderer.render(scene, camera);
        }

        function resetView() {
            targetRotationX = 0;
            targetRotationY = 0;
            camera.position.set(5, 5, 5);
        }

        function toggleWireframe() {
            isWireframe = !isWireframe;
            table.children.forEach(child => {
                if (child.material) {
                    child.material.wireframe = isWireframe;
                }
            });
        }

        function changeTableStyle() {
            // Cycle through different arrangements of light wood and golden wood
            const plankColorSets = [
                [0xDEB887, 0xCD853F, 0xDEB887, 0xCD853F, 0xDEB887], // Alternating pattern
                [0xCD853F, 0xDEB887, 0xCD853F, 0xDEB887, 0xCD853F], // Reverse alternating
                [0xDEB887, 0xDEB887, 0xCD853F, 0xDEB887, 0xDEB887], // Golden center
                [0xCD853F, 0xCD853F, 0xDEB887, 0xCD853F, 0xCD853F]  // Light center
            ];
            
            tableStyle = (tableStyle + 1) % plankColorSets.length;
            
            // Update the table with new color scheme
            if (table) {
                scene.remove(table);
            }
            
            table = new THREE.Group();
            
            const plankWidth = 0.8;
            const numPlanks = 5;
            const currentColors = plankColorSets[tableStyle];
            
            for (let i = 0; i < numPlanks; i++) {
                const plankGeometry = new THREE.BoxGeometry(plankWidth, 0.2, 2.5);
                const plankMaterial = new THREE.MeshLambertMaterial({ 
                    color: currentColors[i]
                });
                const plank = new THREE.Mesh(plankGeometry, plankMaterial);
                plank.position.set(-1.6 + (i * plankWidth), 1.5, 0);
                plank.castShadow = true;
                plank.receiveShadow = true;
                table.add(plank);
            }
            
            // Table legs - golden wood
            const legGeometry = new THREE.BoxGeometry(0.15, 1.5, 0.15);
            const legMaterial = new THREE.MeshLambertMaterial({ 
                color: 0xCD853F 
            });
            
            const legPositions = [
                [-1.7, 0.75, -1], [1.7, 0.75, -1],
                [-1.7, 0.75, 1], [1.7, 0.75, 1]
            ];
            
            legPositions.forEach(pos => {
                const leg = new THREE.Mesh(legGeometry, legMaterial);
                leg.position.set(...pos);
                leg.castShadow = true;
                table.add(leg);
            });
            
            scene.add(table);
        }

        // Initialize the scene
        init();
    </script>
</body>
</html>
